<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pitch Tracker · Session studio</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-brand">
        <span class="standard-brand">Pitch Tracker</span
        ><span class="press-brand">Pitch <span>Tracker</span></span>
      </h1>
      <nav class="tabs" aria-label="Main">
        <button data-ui-click="switch-tab" data-tab="session" class="on">
          Session</button
        ><button data-ui-click="switch-tab" data-tab="history">
          History & progress</button
        ><button data-ui-click="switch-tab" data-tab="admin">Classes</button
        ><button data-ui-click="switch-tab" data-tab="settings">Settings</button
        ><button data-ui-click="switch-tab" data-tab="help">Help</button>
      </nav>
      <div class="app-utilities noprint">
        <select id="themeSelect" aria-label="Theme" title="Theme"></select>
        <button data-ui-click="backup">Back up data</button>
        <small id="saveStatus" role="status">Loading…</small>
      </div>
    </header>
    <div id="storageWarning" class="notice hidden" role="alert"></div>
    <main id="main"></main>
    <dialog id="modal"><div id="modalBody"></div></dialog>
    <div id="toast" role="status" class="hidden"></div>
    <dialog
      id="pitchFeedback"
      aria-labelledby="feedbackMessage"
      aria-describedby="feedbackCaption"
    ></dialog>
    <input
      type="file"
      data-ui-change="import-backup"
      id="importFile"
      accept="application/json,.json"
      hidden
    />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
